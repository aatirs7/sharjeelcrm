name: Agent build

# Triggered by Elysium Builds when the owner approves a client request.
# Runs Claude headless to implement the change, then opens a pull request.
# It only runs when dispatched.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to build (the client request and context)
        required: true
      task_id:
        description: Elysium task id
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Implement the change
        env:
          # Subscription auth (your Max plan), not a pay-per-token API key.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          set -e
          BRANCH="agent/${{ github.run_id }}"
          git checkout -b "$BRANCH"

          GUIDE="Constraints: work only in this repository, do not start a dev server or deploy, keep changes minimal and in the existing style, and open the image URLs above to see what the client means. When you are finished, write a file PR_SUMMARY.md that explains in plain non-technical English (for the business owner) what you changed and what the client will now see. No code, no file names, no jargon, a few short bullet points, plus one final line starting with 'Check:' saying what to look at on the preview to confirm it."
          PROMPT=$(printf '%s\n\n%s' "$TASK" "$GUIDE")

          claude -p "$PROMPT" \
            --dangerously-skip-permissions \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash,WebFetch" \
            --max-turns 40 || true

          if [ -f PR_SUMMARY.md ]; then
            cp PR_SUMMARY.md /tmp/pr_summary.md
            rm -f PR_SUMMARY.md
          fi

          git config user.name "Elysium Agent"
          git config user.email "agent@elysiumbuilds.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "The agent produced no changes."
            exit 0
          fi
          git commit -m "Agent: apply requested changes"
          git push origin "$BRANCH"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="agent/${{ github.run_id }}"
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "No branch pushed, nothing to open."
            exit 0
          fi

          SUMMARY="Automated change from an approved request."
          [ -f /tmp/pr_summary.md ] && SUMMARY="$(cat /tmp/pr_summary.md)"
          NOTE="See it before you merge: Vercel adds a live preview link to this PR shortly. Open it to view the change on the real site. Nothing goes live until you merge. Built automatically from an approved request (task ${{ github.event.inputs.task_id }})."
          printf '%s\n\n---\n\n%s\n' "$SUMMARY" "$NOTE" > /tmp/pr_body.md

          gh pr create \
            --title "Requested changes for review" \
            --body-file /tmp/pr_body.md \
            --head "$BRANCH" \
            --base "${{ github.event.repository.default_branch }}" || true
