name: Agent build

# Triggered by Elysium Builds when the owner approves a client request.
# Runs Claude headless to implement the change, then opens a pull request.
# Does nothing on its own; it only runs when dispatched.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to build (the client request and context)
        required: true
      task_id:
        description: Elysium task id
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Implement the change
        env:
          # Subscription auth (your Max plan), not a pay-per-token API key.
          # Generate once with `claude setup-token` and store as this secret.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          TASK: ${{ github.event.inputs.task }}
        run: |
          set -e
          BRANCH="agent/${{ github.run_id }}"
          git checkout -b "$BRANCH"

          PROMPT="$TASK

Constraints: work only in this repository. Do not start a dev server and do not deploy. Keep changes minimal and in the existing style. Open the image URLs above to see what the client means."

          claude -p "$PROMPT" \
            --dangerously-skip-permissions \
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash,WebFetch" \
            --max-turns 40 || true

          git config user.name "Elysium Agent"
          git config user.email "agent@elysiumbuilds.dev"
          git add -A
          if git diff --cached --quiet; then
            echo "The agent produced no changes."
            exit 0
          fi
          git commit -m "Agent: apply requested changes"
          git push origin "$BRANCH"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="agent/${{ github.run_id }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            gh pr create \
              --title "Agent: requested changes" \
              --body "Automated build from an approved Elysium Builds request (task ${{ github.event.inputs.task_id }}). Review and merge to ship." \
              --head "$BRANCH" \
              --base "${{ github.event.repository.default_branch }}" || true
          else
            echo "No branch pushed, nothing to open."
          fi
